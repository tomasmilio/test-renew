name: Test GitHub secret access

on:
  workflow_dispatch:

permissions: {}

jobs:
  test:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Create GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.ROTATOR_GH_APP_ID }}
          private-key: ${{ secrets.ROTATOR_GH_APP_PRIVATE_KEY }}
          permission-secrets: write

      - name: Write test secret
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh secret set ROTATION_CONNECTION_TEST \
            --repo "$GITHUB_REPOSITORY" \
            --body "connection-test-only"
