name: Test Entra secret rotation

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: entra-secret-rotation
  cancel-in-progress: false

jobs:
  rotate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Sign in to Entra
        uses: azure/login@v3
        with:
          client-id: ${{ vars.ROTATOR_CLIENT_ID }}
          tenant-id: ${{ vars.ENTRA_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.ROTATOR_GH_APP_ID }}
          private-key: ${{ secrets.ROTATOR_GH_APP_PRIVATE_KEY }}
          permission-secrets: write

      - name: Create Entra credential and save to GitHub
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TARGET_APP_OBJECT_ID: ${{ vars.TARGET_APP_OBJECT_ID }}
          DESTINATION_SECRET: ENTRA_CLIENT_SECRET_TEST
        run: |
          set -euo pipefail

          test -n "$TARGET_APP_OBJECT_ID"

          expires=$(date -u -d '+180 days' +'%Y-%m-%dT%H:%M:%SZ')

          body=$(jq -n --arg expires "$expires" '{
            passwordCredential: {
              displayName: "github-test-renew-ENTRA_CLIENT_SECRET_TEST",
              endDateTime: $expires
            }
          }')

          credential=$(az rest \
            --method POST \
            --url "https://graph.microsoft.com/v1.0/applications/${TARGET_APP_OBJECT_ID}/addPassword" \
            --headers "Content-Type=application/json" \
            --body "$body" \
            --output json)

          new_secret=$(jq -er '.secretText' <<< "$credential")
          key_id=$(jq -er '.keyId' <<< "$credential")

          echo "::add-mask::$new_secret"
          echo "Created Entra credential ID: $key_id"

          printf '%s' "$new_secret" | gh secret set "$DESTINATION_SECRET" \
            --repo "$GITHUB_REPOSITORY"

          echo "Saved credential to GitHub secret: $DESTINATION_SECRET"
          echo "Expiration: $expires"
